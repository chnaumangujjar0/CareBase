<svg width="220" height="56" viewBox="0 0 220 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareBase logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: rounded badge with heartbeat pulse, using theme $primary -->
  <rect x="0" y="0" width="56" height="56" rx="16" fill="#0F766E"/>
  <polyline
    points="10,30 18,30 22,20 28,38 34,14 39,30 46,30"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="46" cy="30" r="3" fill="#FFFFFF"/>

  <!-- Wordmark: uses $primary + $dark from _variables.scss, Inter font -->
  <text x="70" y="35" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">
    <tspan fill="#0F766E">Care</tspan><tspan fill="#0F172A">Base</tspan>
  </text>
</svg>
